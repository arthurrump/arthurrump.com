backend:
  name: github
  repo: arthurrump/arthurrump.com
  branch: main

local_backend: true

media_folder: static/images
public_folder: /images

i18n:
  structure: multiple_files
  locales: [en, nl]
  default_locale: en
  omit_default_locale_from_file_path: true

collections:
  - name: articles
    label: Articles
    label_singular: Article
    folder: content/articles
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: subtitle, label: Subtitle, widget: string, required: false, i18n: true }
      - { name: date, label: Date, widget: datetime, i18n: duplicate }
      - { name: authors, label: Authors, widget: list, required: false, i18n: duplicate, hint: "Leave empty to default to site author" }
      - { name: tags, label: Tags, widget: list, required: false, i18n: duplicate }
      - { name: aliases, label: Aliases, widget: list, required: false, i18n: false, hint: "Old URLs that should redirect to this page" }
      - { name: modified, label: Last modified, widget: datetime, required: false, i18n: false }
      - { name: description, label: Description, widget: text, required: false, i18n: true, hint: "Used for meta description and OG tags" }
      - { name: social_image, label: Social image, widget: image, required: false, i18n: false }
      - { name: body, label: Body, widget: markdown, i18n: true }

  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: subtitle, label: Subtitle, widget: string, required: false, i18n: true }
      - { name: date, label: Date, widget: datetime, i18n: duplicate }
      - { name: authors, label: Authors, widget: list, required: false, i18n: duplicate, hint: "Leave empty to default to site author" }
      - { name: tags, label: Tags, widget: list, required: false, i18n: duplicate }
      - { name: aliases, label: Aliases, widget: list, required: false, i18n: false, hint: "Old URLs that should redirect to this page" }
      - { name: modified, label: Last modified, widget: datetime, required: false, i18n: false }
      - { name: description, label: Description, widget: text, required: false, i18n: true, hint: "Used for meta description and OG tags" }
      - { name: social_image, label: Social image, widget: image, required: false, i18n: false }
      - { name: body, label: Body, widget: markdown, i18n: true }

  - name: papers
    label: Papers
    label_singular: Paper
    folder: content/papers
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: subtitle, label: Subtitle, widget: string, required: false, i18n: true }
      - { name: date, label: Date, widget: datetime, i18n: duplicate }
      - { name: authors, label: Authors, widget: list, required: false, i18n: duplicate, hint: "Leave empty to default to site author" }
      - { name: tags, label: Tags, widget: list, required: false, i18n: duplicate }
      - { name: aliases, label: Aliases, widget: list, required: false, i18n: false, hint: "Old URLs that should redirect to this page" }
      - { name: modified, label: Last modified, widget: datetime, required: false, i18n: false }
      - { name: description, label: Description, widget: text, required: false, i18n: true, hint: "Used for meta description and OG tags" }
      - { name: social_image, label: Social image, widget: image, required: false, i18n: false }
      - { name: body, label: Body, widget: markdown, i18n: true }

  - name: notes
    label: Notes
    label_singular: Note
    folder: content/notes
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    # No title/identifier field: Sveltia derives {{slug}} from a random UUID
    # fragment, so note URLs are opaque IDs like /notes/936e17d5/.
    identifier_field: body
    summary: "{{date}} — {{body | trim | truncate 60 }}"
    fields:
      - { name: date, label: Date, widget: datetime }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: syndication, label: Syndication URLs, widget: list, required: false, hint: "POSSE copy URLs (Mastodon, Bluesky, LinkedIn)" }
      - { name: body, label: Note, widget: markdown }

  - name: pages
    label: Pages
    i18n: true
    files:
      - name: about
        label: About
        file: content/about/index.{{locale}}.md
        i18n: true
        fields:
          - { name: title, label: Title, widget: string, i18n: true }
          - { name: body, label: Body, widget: markdown, i18n: true }