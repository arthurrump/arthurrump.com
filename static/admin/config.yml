# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: arthurrump/arthurrump.com
  branch: main

media_folder: static/media
public_folder: /media

i18n:
  structure: multiple_files
  locales: [en, nl]
  default_locale: en
  omit_default_locale_from_file_path: true

collections:
  - name: notes
    label: Notes
    label_singular: Note
    folder: content/notes
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    slug: "{{uuid_short}}"
    summary: "{{body | trim | truncate(60, '...') }}"
    i18n: true
    fields:
      - name: date
        label: Date
        widget: datetime
        input_timezone: local
        output_utc: true
        default: "{{now}}"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        i18n: duplicate
      - name: body
        label: Note
        widget: markdown
        editor_components: []
        linked_images: false
        hint: "Use #hashtags to add tags"
        i18n: true
      - name: media
        label: Media
        widget: list
        i18n: duplicate
        field:
          name: media
          widget: object
          i18n: duplicate
          fields:
            - { name: src, widget: file, accept: "image/*,video/*,audio/*", i18n: duplicate }
            - { name: alt, widget: string, required: false, i18n: true }
        required: false
    view_groups:
      - field: date
        label: Date
        pattern: '\d{4}-\d{2}-\d{2}'

  - divider: true

  - name: articles
    label: Articles
    label_singular: Article
    folder: content/articles
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: subtitle, label: Subtitle, widget: string, required: false, i18n: true }
      - { name: date, label: Date, widget: datetime, type: date, input_timezone: utc, output_utc: true, i18n: duplicate }
      - { name: authors, label: Authors, widget: list, required: false, i18n: duplicate, hint: "Leave empty to default to site author" }
      - { name: tags, label: Tags, widget: list, required: false, i18n: duplicate }
      - { name: aliases, label: Aliases, widget: list, required: false, i18n: false, hint: "Old URLs that should redirect to this page" }
      - { name: modified, label: Last modified, widget: datetime, required: false, i18n: false }
      - { name: description, label: Description, widget: text, required: false, i18n: true, hint: "Used for meta description and OG tags" }
      - { name: social_image, label: Social image, widget: image, required: false, i18n: false }
      - { name: body, label: Body, widget: markdown, i18n: true }

  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: subtitle, label: Subtitle, widget: string, required: false, i18n: true }
      - { name: date, label: Date, widget: datetime, type: date, input_timezone: utc, output_utc: true, i18n: duplicate }
      - { name: authors, label: Authors, widget: list, required: false, i18n: duplicate, hint: "Leave empty to default to site author" }
      - { name: tags, label: Tags, widget: list, required: false, i18n: duplicate }
      - { name: aliases, label: Aliases, widget: list, required: false, i18n: false, hint: "Old URLs that should redirect to this page" }
      - { name: modified, label: Last modified, widget: datetime, required: false, i18n: false }
      - { name: description, label: Description, widget: text, required: false, i18n: true, hint: "Used for meta description and OG tags" }
      - { name: social_image, label: Social image, widget: image, required: false, i18n: false }
      - { name: body, label: Body, widget: markdown, i18n: true }

  - name: publications
    label: Publications
    label_singular: Publication
    folder: content/publications
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: subtitle, label: Subtitle, widget: string, required: false, i18n: true }
      - { name: date, label: Date, widget: datetime, type: date, input_timezone: utc, output_utc: true, i18n: duplicate }
      - { name: authors, label: Authors, widget: list, required: false, i18n: duplicate, hint: "Leave empty to default to site author" }
      - { name: tags, label: Tags, widget: list, required: false, i18n: duplicate }
      - { name: aliases, label: Aliases, widget: list, required: false, i18n: false, hint: "Old URLs that should redirect to this page" }
      - { name: modified, label: Last modified, widget: datetime, required: false, i18n: false }
      - { name: description, label: Description, widget: text, required: false, i18n: true, hint: "Used for meta description and OG tags" }
      - { name: social_image, label: Social image, widget: image, required: false, i18n: false }
      - { name: body, label: Body, widget: markdown, i18n: true }

  - divider: true

  - name: pages
    label: Pages
    i18n: true
    files:
      - name: about
        label: About
        file: content/about/index.{{locale}}.md
        i18n: true
        fields:
          - { name: title, label: Title, widget: string, i18n: true }
          - { name: body, label: Body, widget: markdown, i18n: true }