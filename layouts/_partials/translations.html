{{- /* Inline translation switcher nav */ -}}
{{- if .Translations }}
<nav class="translations">
  <ul class="inline brackets">
    {{- range (sort (append . .Translations) "Lang") }}
    <li><a {{ if eq .Permalink $.Permalink }}aria-current="page" {{ end -}} href="{{ .Permalink }}" hreflang="{{ .Lang }}">{{ .Lang }}</a></li>
    {{- end }}
  </ul>
</nav>
{{- end }}
