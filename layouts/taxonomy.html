{{ define "title" }}{{ site.Title }} / {{ .Title }}{{ end }}

{{- define "content" }}
<h2>{{ .Title }}</h2>
{{ .Content }}
<ul>
    {{ .Content }}
    {{ range .Data.Terms.ByCount }}
        <li><a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}</a> ({{ .Count }})</li>
    {{ end }}
</ul>
{{- end }}
