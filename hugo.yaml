baseURL: https://arthurrump.com
title: Arthur Rump

locale: en
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
timeZone: Europe/Amsterdam

summaryLength: 50

# Multilingual
languages:
  en:
    label: English
    weight: 1
  nl:
    label: Nederlands
    weight: 2

# Taxonomies
taxonomies:
  tag: tags
  author: authors
# URL patterns
permalinks:
  articles: /:slug/
  projects: /:slug/
  publications: /:slug/
  notes: /n/:contentbasename/
  tags: /tags/:slug/
pagination:
  pagerSize: 10

# Markup
markup:
  goldmark:
    parser:
      attribute:
        block: true
        title: true
      wrapStandAloneImageWithinParagraph: false
    renderer:
      unsafe: true
    extensions:
      strikethrough: true
      table: true
  highlight:
    style: github
    noClasses: false

# Output formats
mediaTypes:
  application/atom+xml:
    suffixes:
      - "atom.xml"
  text/redirects:
    suffixes:
      - ""

outputFormats:
  redirects:
    mediaType: text/redirects
    baseName: _redirects
    isPlainText: true
    notAlternative: true
  atom:
    mediaType: application/atom+xml
    baseName: feed
    isPlainText: true
    rel: alternate
  rss:
    baseName: feed

outputs:
  home:
    - html
    - rss
    - atom
    - redirects
  section:
    - html
    - rss
    - atom
  taxonomy:
    - html
    - rss
    - atom
  term:
    - html
    - rss
    - atom

# Feeds
params:
  author: Arthur Rump
  feedDomain: https://arthurrump.com
  menuSections:
    - projects
    - publications
  menuPages:
    - about
